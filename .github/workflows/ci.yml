name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.dc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dc: [ldc-latest, dmd-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      # preGenerateCommands fetches a pinned MIR and compiles it with cc; the
      # unit tests then JIT a function and assert ABI struct sizes / enum values.
      - name: Unit tests
        run: dub test

      - name: Build & run example (end-to-end JIT)
        run: dub run :sum

  coverage:
    name: coverage to Codecov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Test with coverage
        run: dub test --coverage

      - name: Convert coverage to lcov
        run: bash scripts/cov-to-lcov.sh lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
